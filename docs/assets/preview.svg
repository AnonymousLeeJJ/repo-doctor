<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Repo Doctor GitHub repository health report preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101736"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="90" cy="30" r="180" fill="#22d3ee" opacity="0.14"/>
  <circle cx="1130" cy="0" r="170" fill="#8b5cf6" opacity="0.18"/>
  <text x="68" y="88" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">🩺 OPEN SOURCE HEALTH CHECK</text>
  <text x="65" y="170" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">Repo Doctor</text>
  <text x="65" y="222" fill="#a7adbf" font-family="Inter, Arial, sans-serif" font-size="24">输入 GitHub 仓库，生成 100 分制体检报告</text>
  <rect x="65" y="270" width="610" height="78" rx="21" fill="#0b1020" stroke="#384155"/>
  <text x="90" y="320" fill="#8ea0b5" font-family="Inter, Arial, sans-serif" font-size="20">https://github.com/owner/repo</text>
  <rect x="520" y="286" width="140" height="46" rx="15" fill="url(#accent)"/>
  <text x="552" y="316" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">开始体检</text>
  <rect x="65" y="385" width="610" height="180" rx="28" fill="#141b30" stroke="#384155"/>
  <text x="98" y="430" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">README 完整且包含快速开始</text>
  <text x="98" y="463" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">✓ 18 / 18</text>
  <text x="98" y="500" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">! Topics 建议补充 2 个</text>
  <text x="98" y="536" fill="#fda4af" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">× 缺少 SECURITY.md</text>
  <rect x="740" y="270" width="395" height="295" rx="34" fill="#151c31" stroke="#384155"/>
  <circle cx="937" cy="375" r="76" fill="#111827" stroke="url(#violet)" stroke-width="12"/>
  <text x="900" y="388" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900">86</text>
  <text x="990" y="388" fill="#a7adbf" font-family="Inter, Arial, sans-serif" font-size="20">/100</text>
  <text x="884" y="452" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">良好</text>
  <text x="805" y="500" fill="#a7adbf" font-family="Inter, Arial, sans-serif" font-size="17">基础呈现 32 / 35</text>
  <text x="805" y="530" fill="#a7adbf" font-family="Inter, Arial, sans-serif" font-size="17">信任维护 27 / 32</text>
  <text x="68" y="602" fill="#7c8497" font-family="Inter, Arial, sans-serif" font-size="16">无需登录 · 公开 API · 17 项检查 · 支持报告链接和 Markdown 徽章</text>
</svg>
